spring.application.name=backend-demo
# Conexión a la base de datos de demo
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3307}/lecfantasy_demo
spring.datasource.username=${DB_USER:fantasy_user}
spring.datasource.password=${DB_PASSWORD:fantasypassword}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Forzar recreación de tablas para asegurar estado limpio en cada arranque de demo
# Una vez estable, se podría cambiar a 'update'
spring.jpa.hibernate.ddl-auto=update

# Logging detallado para ver la magia del scheduler y la API en la demo
logging.level.com.lecfantasy.backend=INFO
logging.level.org.springframework.scheduling=DEBUG

# Asegurar que el reloj virtual esté disponible
management.endpoints.web.exposure.include=*
